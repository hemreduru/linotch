name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and layer-shell headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtk-layer-shell-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          d="linotch-$v-x86_64-linux"
          mkdir -p "$d"
          cp target/release/linotch linotch.desktop README.md LICENSE "$d/"
          tar czf "$d.tar.gz" "$d"
          sha256sum "$d.tar.gz" > "$d.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linotch-*.tar.gz
            linotch-*.tar.gz.sha256
          generate_release_notes: true
